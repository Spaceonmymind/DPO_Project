<!doctype html>
<html lang="ru">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DOCX workspace layout test</title></head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { TemplateAdmin } from "/src/TemplateAdmin.tsx";
      import "/src/styles.css";
      import "/src/enhancements.css";

      const longLabel = "Порядок оплаты и подтверждения оказанных услуг по договору с дополнительными условиями и примечаниями для проверки длинного названия вопроса";
      const field = { id: "field-1", field_key: "payment_order", label: longLabel, field_type: "SINGLE_SELECT", required: true, position: 1, config: { group: "Основные сведения", placeholder: "", options: ["100% постоплата", "50% предоплата"] } };
      const version = { id: "version-1", template_id: "template-1", version_number: 1, status: "DRAFT", original_filename: "sample.docx" };
      const nodes = [
        { locator: "word/document.xml#/p[1]", kind: "paragraph", text: "Порядок оплаты услуг по договору" },
        { locator: "word/document.xml#/tbl[1]/tr[1]/tc[1]", kind: "table_cell", text: "Строка графика тренировок" },
      ];
      const group = { id: "group-1", group_key: "schedule", name: "График тренировок", description: "", required: false, min_items: 0, max_items: 10, position: 1, status: "ACTIVE", config: {}, locator: { part: "word/document.xml", table: 1, row: 1, row_count: 1 }, fields: [{ id: "group-field-1", group_id: "group-1", field_key: "session", label: "Название занятия", field_type: "TEXT", required: true, position: 1, config: { options: [] } }] };
      const api = async (path, options = {}) => {
        if (path === "/document-templates") return [{ id: "template-1", name: "Тестовый договор", category: "Договоры", version_count: 1 }];
        if (path.endsWith("/versions")) return [version];
        if (path.endsWith("/preview")) return { nodes };
        if (path.endsWith("/questionnaire")) return { fields: [field] };
        if (path.endsWith("/repeating-groups")) return [group];
        if (/\/(bindings|conditional-regions|binding-candidates)$/.test(path)) return [];
        throw new Error(`Unexpected fixture request: ${options.method || "GET"} ${path}`);
      };
      createRoot(document.getElementById("root")).render(React.createElement(TemplateAdmin, { api }));
    </script>
  </body>
</html>

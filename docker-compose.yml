services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: dpo, POSTGRES_USER: dpo, POSTGRES_PASSWORD: dpo }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dpo -d dpo"], interval: 5s, timeout: 3s, retries: 20 }
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dpo:dpo@db:5432/dpo
      STORAGE_LOCAL_PATH: /app/storage
      AUTH_PROVIDER: ${AUTH_PROVIDER:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-qwen}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-10}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_CONCURRENT_REQUESTS: ${LLM_MAX_CONCURRENT_REQUESTS:-5}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
      LLM_STRUCTURED_OUTPUT_MODE: ${LLM_STRUCTURED_OUTPUT_MODE:-prompt}
      LLM_CONTEXT_MAX_TOKENS: ${LLM_CONTEXT_MAX_TOKENS:-16000}
      LLM_HISTORY_MAX_MESSAGES: ${LLM_HISTORY_MAX_MESSAGES:-30}
      LLM_LOG_CONTENT: ${LLM_LOG_CONTENT:-false}
      LLM_EXTERNAL_DATA_TRANSFER: ${LLM_EXTERNAL_DATA_TRANSFER:-false}
      LLM_PROVIDER_IS_INTERNAL: ${LLM_PROVIDER_IS_INTERNAL:-false}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes: [./storage:/app/storage]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 10 }
  frontend:
    build: ./frontend
    depends_on: { backend: { condition: service_healthy } }
    ports: ["5173:80"]
volumes: { postgres_data: {} }
